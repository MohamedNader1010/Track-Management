<app-global-loader />

<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/tracks" class="brand">
      <img src="takwene-logo.png" alt="Takwene" class="logo" width="170" height="41" />
    </a>

    <nav>
      <a routerLink="/tracks" routerLinkActive="active">Tracks</a>
      <a routerLink="/artists" routerLinkActive="active">Artists</a>
    </nav>

    <div class="session">
      @if (auth.currentUser(); as user) {
      <span class="user">
        {{ user.username }}
        @for (role of user.roles; track role) {
        <small class="role">{{ role }}</small>
        }
      </span>
      <button type="button" class="btn ghost" (click)="logout()">Sign out</button>
      } @else {
      <a routerLink="/login" class="btn ghost">Sign in</a>
      }
    </div>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<app-toast-outlet />
